<title>Lab 4 Lockdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a security console. Sticky status bar (timer, doors), one room card at a time, collected fragments below. Single dark look by design. */
:root{
  color-scheme: dark;
  --bg:#0e1822;
  --panel:#15232f;
  --panel-2:#1b2c3a;
  --line:#2a3e4f;
  --ink:#e4ecf1;
  --muted:#93a7b6;
  --amber:#f0b23c;
  --amber-ink:#1a1306;
  --ok:#47c1a3;
  --bad:#ee6b5c;
  --link:#8cc8ff;
  --f-display:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-right:auto}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.timer.low{color:var(--amber)}
.timer.over{color:var(--bad)}
.stats{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;gap:14px}
.doors{display:flex;gap:6px;width:100%}
.door{flex:1;height:8px;border-radius:2px;background:var(--line)}
.door.open{background:var(--ok)}
.door.here{background:var(--amber)}
main{padding-block:24px 48px}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,var(--bg) 14px 28px);border-radius:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card .inner{padding:22px 22px 24px;display:grid;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1.02;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,7vw,3.8rem)}
h2{font-size:clamp(1.9rem,5vw,2.6rem)}
p{margin:0;max-width:65ch}
.story{color:var(--ink)}
.task{background:var(--panel-2);border-left:3px solid var(--amber);padding:14px 16px;border-radius:0 4px 4px 0;display:grid;gap:8px}
.task strong{color:var(--amber)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{font-family:var(--f-mono);font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;color:var(--link);background:var(--bg)}
.tool:hover{border-color:var(--link)}
form.lock{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.lock label{width:100%;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lock input{flex:1 1 220px;min-width:0;font-family:var(--f-mono);font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.lock input::placeholder{color:var(--muted);letter-spacing:.04em;text-transform:none;font-size:1rem}
.btn{font-family:var(--f-body);font-weight:600;font-size:1rem;border-radius:4px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-family:var(--f-mono);font-size:.92rem;min-height:1.4em}
.msg.bad{color:var(--bad)}
.msg.warn{color:var(--amber)}
.msg.ok{color:var(--ok)}
.hint{border:1px dashed var(--line);border-radius:4px;padding:12px 14px;color:var(--muted)}
.hint b{color:var(--ink)}
.hints{display:grid;gap:10px}
.riddle{font-style:italic;max-width:65ch}
.task .eyebrow{color:var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{background:var(--bg);border:1px solid var(--ok);border-radius:4px;padding:14px 16px;display:grid;gap:6px}
.note .eyebrow{color:var(--ok)}
.frag{display:flex;flex-wrap:wrap;gap:8px}
.tile{width:46px;height:56px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2rem;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tile.got{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.section{margin-top:22px;display:grid;gap:10px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.unlock{animation:unlock .5s ease-out}
@keyframes unlock{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.unlock{animation:none}}
.lessons{margin:0;padding-left:1.2em;display:grid;gap:6px}
.logwrap{overflow-x:auto}
.log{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.log th,.log td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.log th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem}
.log td.r{text-align:right}.log th.r{text-align:right}
.log tr.fast td{color:var(--amber)}
.big{font-family:var(--f-mono);font-size:clamp(2rem,8vw,3.2rem);font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;padding-block:0 32px}
</style>

<div class="bar">
  <div class="wrap">
    <div class="brand">Lab 4 Lockdown</div>
    <div class="stats" aria-live="off"><span id="st-team"></span><span id="st-hints">Hints 0</span><span id="st-wrong">Wrong 0</span></div>
    <div class="timer" id="timer" aria-label="Time remaining">60:00</div>
    <div class="doors" id="doors" aria-hidden="true"></div>
  </div>
</div>

<main class="wrap">
  <div id="view"></div>

  <div class="section" id="fragments-box" hidden>
    <div class="eyebrow">Fragments of the exit code</div>
    <div class="frag" id="fragments"></div>
  </div>
</main>

<footer class="wrap">
  <div class="row" id="reset-row">
    <button class="btn ghost" type="button" id="reset">Restart the game</button>
    <span class="confirm" id="reset-confirm" hidden>Erase this team's progress?
      <button class="btn" type="button" id="reset-yes">Yes, restart</button>
      <button class="btn ghost" type="button" id="reset-no">Cancel</button>
    </span>
  </div>
</footer>

function fmt(ms){var neg=ms<0;ms=Math.abs(ms);var s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return (neg?"+":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}

  view.innerHTML="";
  var c=el("section",{class:"card"});
  c.appendChild(el("div",{class:"hazard"}));
  var inner=el("div",{class:"inner"});
  inner.innerHTML=
    '<div class="eyebrow">Faculty of Pharmacy &middot; Lab 4 &middot; 16:59</div>'+
    '<h1>The doors are sealed</h1>'+
    '<p class="story">You stayed late in Lab 4 to finish an experiment. At 17:00 the building’s security system reports a <b>database integrity alarm</b> and locks every door. The only way out is to prove to the system that you know how to use <b>DrugBank</b>, <b>UniProt</b> and the <b>PDB</b>.</p>'+
    '<p class="story">Ten locked rooms stand between you and the exit. Each lock carries a riddle, and each answer can only be found, or worked out, with those databases. Every opened lock gives you one letter of the <b>exit code</b>.</p>'+
    '<div class="task"><div><strong>Rules.</strong> You have 70 minutes. Each room has two hints, and each hint you open adds 5 minutes to your time. Wrong codes are counted. AI chatbots are switched off by the security system: use only the databases. Keep DrugBank (logged in), UniProt and the PDB open in other tabs.</div></div>';
  var form=el("form",{class:"lock",id:"start-form"});
  form.innerHTML='<label for="team-name">Team name</label><input id="team-name" name="team" maxlength="24" autocomplete="off" placeholder="For example: The Ligands"><button class="btn primary" type="submit">Start the clock</button><div class="msg" id="start-msg" role="status"></div>';
  inner.appendChild(form);
  c.appendChild(inner);view.appendChild(c);
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var name=$("team-name").value.trim();
    if(!name){$("start-msg").textContent="Type a team name to start.";$("start-msg").className="msg warn";return;}
    S={team:name,start:Date.now(),room:0,hints:[],wrong:0,done:null,found:[],ends:[],wrongBy:[]};save();render();
  });
}

function renderRoom(){
  var r=ROOMS[S.room];
  view.innerHTML="";
  var c=el("section",{class:"card unlock"});
  c.appendChild(el("div",{class:"hazard"}));
  var inner=el("div",{class:"inner"});
  var links=TOOLS.map(function(l){return '<a class="tool" href="'+l.url+'" target="_blank" rel="noopener">'+l.label+' &#8599;</a>';}).join("");
  inner.innerHTML=
    '<div class="eyebrow">Room '+(S.room+1)+' of '+ROOMS.length+'</div>'+
    '<h2>'+r.name+'</h2>'+
    '<p class="story">'+r.story+'</p>'+
    '<div class="task"><div class="eyebrow">Engraved on the lock</div><div class="riddle">'+r.riddle+'</div></div>'+
    '<div class="tools">'+links+'</div>';
  var form=el("form",{class:"lock",id:"lock-form"});
  form.innerHTML='<label for="code">'+r.prompt+'</label><input id="code" name="code" autocomplete="off" spellcheck="false" placeholder="Type the code"><button class="btn primary" type="submit">Unlock</button><div class="msg" id="msg" role="status" aria-live="polite"></div>';
  inner.appendChild(form);
  var hintBox=el("div",{class:"hints"});
  var shown=0;
  for(var hi=0;hi<r.hints.length;hi++){
    if(S.hints.indexOf(S.room+"."+hi)>=0){hintBox.appendChild(el("div",{class:"hint"},"<b>Hint "+(hi+1)+".</b> "+r.hints[hi]));shown=hi+1;}
  }
  if(shown<r.hints.length){
    var level=shown;
    var hintRow=el("div",{class:"row"});
    var hb=el("button",{class:"btn ghost",type:"button",id:"hint-btn"},"Open hint "+(level+1)+" of "+r.hints.length+" (+"+HINT_PENALTY_MIN+" min)");
    var conf=el("span",{class:"confirm",hidden:""});
    conf.innerHTML='Add '+HINT_PENALTY_MIN+' minutes to your time? <button class="btn" type="button" id="hint-yes">Yes, open it</button> <button class="btn ghost" type="button" id="hint-no">Cancel</button>';
    hintRow.appendChild(hb);hintRow.appendChild(conf);
    hb.addEventListener("click",function(){hb.hidden=true;conf.hidden=false;});
    conf.querySelector("#hint-no").addEventListener("click",function(){conf.hidden=true;hb.hidden=false;});
    conf.querySelector("#hint-yes").addEventListener("click",function(){S.hints.push(S.room+"."+level);save();renderRoom();renderBar();});
    hintBox.appendChild(hintRow);
  }
  inner.appendChild(hintBox);
  c.appendChild(inner);view.appendChild(c);
  var input=$("code");
  try{input.focus({preventScroll:true});}catch(e){}
  form.addEventListener("submit",async function(e){
    e.preventDefault();
    var v=norm(input.value),msg=$("msg");
    if(!v){msg.textContent="Type a code first.";msg.className="msg warn";return;}
    var h=await sha256(r.salt+v);
    for(var a=0;a<r.answers.length;a++){
      if(r.answers[a].h===h){var data=await unseal(r.answers[a].d,r.key+v);solved(data);return;}
    }
    for(var i=0;i<r.near.length;i++){
      if(r.near[i].h===h){msg.textContent=r.near[i].msg;msg.className="msg warn";addWrong();save();renderBar();return;}
    }
    addWrong();save();renderBar();
    msg.textContent="ACCESS DENIED. That code does not open this door.";msg.className="msg bad";
    form.classList.remove("shake");void form.offsetWidth;form.classList.add("shake");
  });
}

function solved(data){
  var r=ROOMS[S.room];
  S.found[S.room]=data;S.ends[S.room]=Date.now();S.room++;save();
  view.innerHTML="";
  var c=el("section",{class:"card unlock"});
  c.appendChild(el("div",{class:"hazard"}));
  var inner=el("div",{class:"inner"});
  inner.innerHTML=
    '<div class="eyebrow">Room '+S.room+' unlocked</div>'+
    '<h2>Door open</h2>'+
    '<div class="row"><span>Fragment found:</span><div class="tile got">'+escapeHtml(data.letter)+'</div></div>'+
    '<div class="note"><div class="eyebrow">Lab note</div><p>'+data.note+'</p></div>';
  var next=el("button",{class:"btn primary",type:"button",id:"next-btn"},S.room<ROOMS.length?"Go to room "+(S.room+1):"Go to the exit door");
  next.addEventListener("click",render);
  inner.appendChild(next);
  c.appendChild(inner);view.appendChild(c);
  try{next.focus({preventScroll:true});}catch(e){}
  renderBar();renderFragments();
}

function renderExit(){
  view.innerHTML="";
  var c=el("section",{class:"card unlock"});
  c.appendChild(el("div",{class:"hazard"}));
  var inner=el("div",{class:"inner"});
  inner.innerHTML=
    '<div class="eyebrow">Exit door</div>'+
    '<h2>One last lock</h2>'+
    '<p class="story">The exit keypad wants one word. You hold all ten letters, but not in the right order.</p>'+
    '<div class="task"><div class="eyebrow">Engraved on the exit</div><div class="riddle">I am the first step of pharmacokinetics, the A in ADME: how a drug gets from the place where it is given into the blood. When a tablet has a low oral bioavailability, either I went badly or first-pass metabolism came right after me. Rearrange the ten letters you collected to name me.</div></div>';
  var form=el("form",{class:"lock",id:"exit-form"});
  form.innerHTML='<label for="exit-code">Exit code (10 letters)</label><input id="exit-code" autocomplete="off" spellcheck="false" maxlength="14" placeholder="Rearranged word"><button class="btn primary" type="submit">Open the exit</button><div class="msg" id="exit-msg" role="status" aria-live="polite"></div>';
  inner.appendChild(form);c.appendChild(inner);view.appendChild(c);
  form.addEventListener("submit",async function(e){
    e.preventDefault();
    var v=norm($("exit-code").value),msg=$("exit-msg");
    if(!v){msg.textContent="Type the word first.";msg.className="msg warn";return;}
    var h=await sha256(EXIT.salt+v);
    if(EXIT.answers.indexOf(h)>=0){S.done=Date.now();save();render();return;}
    if(EXIT.near.indexOf(h)>=0){msg.textContent="So close. Use exactly the ten letters you hold.";msg.className="msg warn";addWrong();save();renderBar();return;}
    addWrong();save();renderBar();
    msg.textContent="ACCESS DENIED. Try another order of the letters.";msg.className="msg bad";
    form.classList.remove("shake");void form.offsetWidth;form.classList.add("shake");
  });
}


function clock(ms){var d=new Date(ms);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(x){return String(x).padStart(2,"0");}).join(":");}
function logHtml(){
  var rows="",prev=S.start,FAST=30000;
  var names=ROOMS.map(function(r,i){return (i+1)+". "+r.name;}).concat(["Exit door"]);
  for(var i=0;i<=ROOMS.length;i++){
    var end=i<ROOMS.length?S.ends[i]:S.done;
    if(!end){continue;}
    var dur=prev?end-prev:0,h=0;
    if(i<ROOMS.length){for(var k=0;k<S.hints.length;k++){if(String(S.hints[k]).split(".")[0]===String(i))h++;}}
    var fast=i<ROOMS.length&&dur<FAST;
    rows+='<tr'+(fast?' class="fast"':'')+'><td>'+escapeHtml(names[i])+'</td><td>'+clock(end)+'</td><td class="r">'+fmt(dur)+'</td><td class="r">'+(S.wrongBy[i]||0)+'</td><td class="r">'+(i<ROOMS.length?h:"")+'</td><td>'+(fast?"under 30 s":"")+'</td></tr>';
    prev=end;
  }
  return '<div class="note"><div class="eyebrow">Activity log</div><p>Started at '+clock(S.start)+'. Times are real time, without hint penalties.</p>'+
    '<div class="logwrap"><table class="log"><thead><tr><th>Room</th><th>Solved at</th><th class="r">Time in room</th><th class="r">Wrong codes</th><th class="r">Hints</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function renderDone(){
  view.innerHTML="";
  var c=el("section",{class:"card unlock"});
  c.appendChild(el("div",{class:"hazard"}));
  var inner=el("div",{class:"inner"});
  var t=elapsedMs(),inTime=t<=LIMIT_MIN*60000;
  var lessons=ROOMS.map(function(r,i){return "<li><b>"+r.name+".</b> "+r.lesson+"</li>";}).join("");
  inner.innerHTML=
    '<div class="eyebrow">Exit open &middot; Team '+escapeHtml(S.team)+'</div>'+
    '<h1>'+(inTime?"You escaped":"You escaped, in overtime")+'</h1>'+
    '<div class="big">'+fmt(t).replace("+","")+'</div>'+
    '<p>'+S.hints.length+' hint'+(S.hints.length===1?"":"s")+' (included in the time) &middot; '+S.wrong+' wrong code'+(S.wrong===1?"":"s")+'. Show this screen to your teacher.</p>'+
    logHtml()+
    '<div class="note"><div class="eyebrow">What the ten rooms taught you</div><ol class="lessons">'+lessons+'</ol></div>';
  c.appendChild(inner);view.appendChild(c);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}

function render(){
  renderBar();renderFragments();
  if(!S.start)renderStart();
  else if(S.done)renderDone();
  else if(S.room<ROOMS.length)renderRoom();
  else renderExit();
}

$("reset").addEventListener("click",function(){$("reset").hidden=true;$("reset-confirm").hidden=false;});
$("reset-no").addEventListener("click",function(){$("reset-confirm").hidden=true;$("reset").hidden=false;});
$("reset-yes").addEventListener("click",function(){
  S={team:"",start:null,room:0,hints:[],wrong:0,done:null,found:[],ends:[],wrongBy:[]};
  try{localStorage.removeItem(KEY);}catch(e){}
  $("reset-confirm").hidden=true;$("reset").hidden=false;render();
});

setInterval(function(){if(S.start&&!S.done)renderBar();},1000);
render();
})();
</script>
